    url: https://github.com/robotmabel/open_mabel/tree/main/hardware/sheet_metal
    label: Sheet-metal flat patterns (DXF)
  - type: code
    url: https://github.com/robotmabel/open_mabel/tree/main/firmware
    label: Firmware
