format_version: "1.0"
name: MABEL
summary: An open-source mobile robot with a swerve base, a lift and two arms with hands, for household tasks.
category: home
difficulty: advanced
license:
  hardware: CERN-OHL-S-2.0
  software: Apache-2.0
  documentation: CC-BY-4.0
source:
